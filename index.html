const term=a=>(/^\d+$/.test(a[4])?"до "+a[4]:a[4])+" мес.";
const fine=a=>typeof a[5]==="number"?a[5].toLocaleString("ru-RU")+"$":a[5];
const line=a=>`${a[0]} (${a[1]}) ${a[2]} | розыск ${a[3]||"—"} | срок ${term(a)} | штраф ${fine(a)||"нет"}${a[6]?" | "+a[6]:""}`;
const CORPUS=RULES.map(r=>`${r[0]} ${r[1]}: ${r[2]}`).join("\n")+"\n"+ARTS.map(line).join("\n");
const $=s=>document.querySelector(s);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let ch="general",q="",t="",w="";
const chOf=a=>String(parseInt(a[0]));
function hl(s){const e=esc(s);if(!q)return e;const r=esc(q.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"));return e.replace(new RegExp("("+r+")","gi"),"<mark>$1</mark>")}
function nav(){const searching=q||t||w;$("#nav").innerHTML=Object.keys(CH).map(k=>{const n=k==="general"?RULES.length:ARTS.filter(a=>chOf(a)===k).length;return `<button data-id="${k}" aria-current="${!searching&&k===ch}">${esc(k==="general"?CH[k]:"Гл. "+k+" · "+CH[k])}<small>${n}</small></button>`}).join("")}
function artCard(a){const p=a[3]?`<span>Розыск <b>${esc(a[3])}</b></span>`:"";const f=fine(a);return `<article class="${a[1]}"><h2><span class="num">${hl(a[0])}</span><span class="b ${a[1]}">${a[1]==="F"?"Федеральное":"Региональное"}</span>${hl(a[2])}</h2><div class="meta">${p}<span class="pen">${esc(term(a))}</span>${f?`<span class="pen">штраф ${hl(f)}</span>`:""}</div>${a[6]?`<p class="meta" style="margin-top:6px">${hl(a[6])}</p>`:""}</article>`}
function ruleCard(r){return `<article><h2><span class="num">${hl(r[0])}</span>${hl(r[1])}</h2><p>${hl(r[2])}</p></article>`}
function render(){
  nav();const searching=q||t||w,nq=q.toLowerCase();let out="",n=0;
  const okA=a=>(!t||a[1]===t)&&(!w||String(a[3]).includes(w))&&(!q||line(a).toLowerCase().includes(nq));
  const showRules=!t&&!w&&(searching?q&&true:ch==="general");
  if(showRules)RULES.forEach(r=>{if(!q||r.join(" ").toLowerCase().includes(nq)){out+=ruleCard(r);n++}});
  if(searching||ch!=="general")ARTS.forEach(a=>{if((searching||chOf(a)===ch)&&okA(a)){out+=artCard(a);n++}});
  const title=searching?`Найдено: ${n}`:(ch==="general"?CH.general:"Глава "+ch+" · "+CH[ch]);
  $("#list").innerHTML=`<p class="head">${esc(title)}</p>`+(n?out:`<p class="empty">Ничего не найдено. Проверьте номер статьи, снимите фильтры или попробуйте другое слово.</p>`);
}

["Гл. 3. Процессы","7","Основания задержания","Задержание не наказание, а краткое ограничение свободы для сбора доказательств. Основания: поймали при преступлении или сразу после, явные следы, фото/видео/аудио фиксация, попытка скрыться, ордер, указ уполномоченного, нахождение в розыске. В розыск нельзя объявлять общими формулировками (кроме автоматического розыска базы).",""],
["Гл. 3. Процессы","8","Порядок задержания","8.1.1 наручники и причина; 8.1.2 представиться; 8.1.3 правило Миранды (повтор не более двух раз); 8.1.4 первичный обыск; 8.1.5 доставка в участок, офис или тюрьму; 8.1.6 снятие маски и опознание; 8.1.7 адвокат или медик и один звонок до 5 минут (ждать ответа 3 минуты, адвоката до 10); 8.1.8 допрос до 20 минут при адвокате или прокуроре (без них запись хранят 72 часа); 8.1.9 перевод в тюрьму и мера пресечения через розыск в КПК. USSS и NG доводят задержание до 8.1.4. Видеофиксацию хранят 72 часа.",""],
["Гл. 3. Процессы","9","Задержание госслужащего","Доводится до 8.1.6, затем стоп: по требованию вызывают руководство задержанного, прокуратуру и адвоката. Задержанный обязан предъявить удостоверение. Продолжение после служебного разбирательства. Неприкосновенные лица: по закону о неприкосновенности.",""],
["Гл. 3. Процессы","10","Передача задержанного","Постовой сотрудник может довести задержание до 8.1.4 и передать уполномоченному, предъявив удостоверение, информацию и доказательства.",""],
["Гл. 3. Процессы","11–14","Обыски и субъекты задержания","Обыск на месте, жилища и автомобиля, а также субъекты задержания. В базе пока без подробностей, смотрите текст кодекса.",""],
["Гл. 4. Освобождение","15","Основания освобождения","Освободить обязаны, если нет оснований для меры пресечения, задержание длится дольше 60 минут или проведено с нарушением кодекса. В лимит не входят: допрос, ожидание руководства, адвоката, FIB, прокурора, EMS (до 15 минут), звонок до 5 минут, передача задержанного. Допустимые отступления: порядок 8.1.1–8.1.6, формулировка Миранды без потери смысла, порядок первичного обыска по ст. 11.",""],
["Гл. 4. Освобождение","16","Сроки давности","Дорожный кодекс 48 часов, административный 6 суток. УК: небольшой тяжести 6 суток, средней 8, тяжкие и особо тяжкие 10. Дело принято судом: 12 суток; +7 суток при принятой апелляции; после обвинительного акта 7 суток с публикации постановления.",""],
["Гл. 5. Ордера","19–20","Виды ордеров и принципы","Ордер на задержание: Генпрокурор или заместитель (при их отсутствии Губернатор), с целью задержания. На арест: судья или Генпрокурор. На обыск: Генпрокурор, заместитель, судья. На рейд территории: Генпрокурор, судья. Снятие неприкосновенности по закону о неприкосновенности. Ордер действует с подписания, обвинение не на предположениях; запрашивают прокуратура, правоохранители, судьи.",""],
["Гл. 5. Ордера","18, 21–25","Допрос и расследование","Допрос и расследование по уголовным делам (возбуждение, подследственность, полномочия следователя, взаимодействие и надзор, методы). В базе пока без подробностей.",""]
],
sd:[
["Статьи","1–2","Задачи и принципы","Презумпция невиновности, решение на достаточных доказательствах, гласность, состязательность. Суд рассматривает дело от прокуратуры в течение 3 рабочих дней и публикует уведомление о начале производства или об отказе (дело идёт на дорасследование 24 часа). Заседание назначают минимум за 12 часов; свидетелей заявляют не позже чем за 3 часа. Обжалование за 48 часов. Лишение свободы до 75 мес., моральная компенсация до 100 000$.",""],
["Статьи","3–4","Инстанции и гласность","Верховный, Апелляционный (один судья) и Окружной суды. Окружной рассматривает все нарушения в штате, кроме дел высших должностных лиц и конституционных споров. Заседание открытое или закрытое (тайны), всегда записывается.",""],
["Статьи","5","Участники","Судья; прокурор (Генпрокурор, прокурор, при невозможности агент FIB); потерпевший или истец; подсудимый или ответчик с адвокатом (адвокат подсудимого обязателен); свидетели.",""],
["Статьи","6","Поведение в суде","Обращаться «Ваша честь», не кричать, не браниться, не танцевать, быть опрятным. Судья может удалить из зала, наложить судебный штраф или задержать.",""],
["Статьи","7","Жалобы на госслужащих","Жалоба в течение 48 часов с доказательствами. Прокурор решает о служебном расследовании, затем закрывает жалобу или составляет обвинительный акт. Доказательства хранятся 72 часа. Отказ обжалуется иском в Окружной суд в течение 48 часов.",""],
["Статьи","8","Ход заседания","Начало не позже 20 минут после назначенного. Порядок: вступительные речи, потерпевший, ходатайства, допрос свидетелей под присягой (прямой и перекрёстный), протесты, финальные речи, вопрос о признании вины, совещание, приговор. Приговор действует с подписания, письменный вариант за 24 часа. Апелляция: подать за 48 часов, рассмотрение 72 часа. Выплаты за 48 часов, возможна отсрочка.",""],
["Статьи","9","Ордера и постановления","Ордер выдаёт судья по ходатайству прокуратуры: снятие неприкосновенности, задержание подозреваемого, арест подсудимого. Постановления Верховного суда обязательны для всех судов.",""],
["Статьи","10","Досудебное урегулирование","Правоохранители собирают полный набор улик для прокурора. Прокурор проверяет законность, может вернуть дело на дорасследование или прекратить, уведомив суд.",""]
],
td:[
["Статьи","1","Основные положения","Гарантии трудовых прав, защита работников и работодателей, запрет принудительного труда и дискриминации. Действует для госорганизаций и частных.",""],
["Статьи","2","Работодатель","Вправе нанимать и увольнять, требовать соблюдения правил, издавать уставы, поощрять, налагать взыскания, устанавливать график. Обязан соблюдать законы, обеспечивать условия труда, платить зарплату и премии, давать карьерный рост, рассматривать жалобы, знакомить с уставом; договор только при личном присутствии, копия паспорта в личное дело.",""],
["Статьи","3","Работник","Вправе уйти по желанию, получить информацию об условиях, отпуск, зарплату, обучение, причину увольнения за 48 часов, обратиться в суд. В госорганизацию не берут с судимостью или при записи в чёрном списке. Обязан добросовестно трудиться, соблюдать устав и законы, быть вежливым, вести отчётность, соблюдать дресс-код, иметь медстраховку, сообщать о смене паспорта.",""],
["Статьи","4","Рабочее время","Рабочий день в госорганизациях до 12 часов, время отдыха до 2 часов. Отпуск по уважительной причине обязателен, за успехи по усмотрению работодателя.",""],
["Статьи","5","Оплата и премии","Почасовая оплата и премии (по решению работодателя, при проблемах с казной могут задерживаться). Еженедельные премии правительства: FIB, SAHP, LSPD, NG, USSS, EMS через Министерство финансов; LSPD, SAHP и FIB нужен военный билет.",""],
["Статьи","6","Дисциплина","Правила распорядка утверждает работодатель с учётом мнения Прокуратуры. Поощрения: благодарность, грамота, подарок, премия. Взыскания в течение 12 часов: выговор, понижение, увольнение, лишение премии, временное отстранение. Взыскание можно снять через 3 дня без новых нарушений.",""],
["Статьи","7","Отстранение","Временная мера с сохранением зарплаты и должности. Отстраняет руководитель организации, а также Губернатор, Вице-губернатор, Генпрокурор (с уведомлением руководителя). Основания: досудебное разбирательство, ОРМ, переаттестация, превышение полномочий.",""],
["Статьи","8","Прекращение отношений","По желанию работника или по инициативе работодателя (нарушения устава, непогашенные нарушения УК, прогул, опьянение, конфликты, некомпетентность, сокращение с выплатой, запись в ЧС). Восстановиться после увольнения по собственному желанию можно за 30 дней; после увольнения работодателем по усмотрению руководства. С тюремными сроками и криминальным прошлым в госорганизации не берут.",""],
["Статьи","9","Защита прав","Мирное урегулирование или обращение в Прокуратуру, главный надзорный орган: возбуждает дела, принимает жалобы, проверяет, консультирует. Нарушение трудового законодательства влечёт и административную ответственность.",""]
],
et:[
["Статьи","1","Понятие","Свод принципов и правил поведения для всех жителей. Если ситуации нет в кодексе, руководствуются общей моралью и этикой.",""],
["Статьи","2","Общие правила","Взаимное уважение, помощь госорганизациям, опрятный вид, честность, чистота. Нельзя халатно относиться к госимуществу и вандализм. Этикет: приветствие, прощание, благодарность, пунктуальность, обращение на «Вы», не перебивать, не грубить, не шуметь.",""],
["Статьи","3–4","Общественные места и госучреждения","Нельзя кричать, браниться, находиться без нижней части одежды (в госучреждениях и без верхней), совершать сексуальные действия и выкрики эротического характера. В общественных местах нельзя употреблять наркотики, в госучреждениях танцевать и заниматься физическими упражнениями.",""],
["Статьи","5","Профессиональная этика","Сотрудник вежлив, соблюдает субординацию, опрятен, говорит без сленга и мата, на «Вы», не разглашает служебную информацию, соблюдает устав. При обращении предъявляет удостоверение, бейдж, жетон или нашивку; безосновательное требование удостоверения от гражданина расценивается по 10.13 УК. Сотрудники предъявляют документы друг другу. Наркотики запрещены.",""],
["Статьи","6","Дресс-код","Сотрудникам запрещены татуировки на кистях, лице и шее, неестественные цвета волос, яркий макияж, сумки и рюкзаки, неуставные аксессуары, светящаяся одежда, нестандартные очки, линзы и маски (кроме балаклавы госструктур). Разрешены мелкие серьги-гвоздики. Исключения: внедрение и работа под прикрытием (LSPD, FIB, USSS, SAHP); маски также у медиков и NG.",""]
],
ks:[
["Статьи","I","Основы строя","Штат часть США. Права человека высшая ценность, народ источник власти (выборы, референдумы; референдум нельзя по налогам, бюджету, амнистии). Конституция выше всех актов. Три ветви власти, язык английский, многопартийность и свобода вероисповедания.",""],
["Статьи","II","Законодательная власть","Конгресс; Палата представителей из 6 руководителей структур (GOV, FIB, LSPD, SAHP, NG, EMS). Заседания не реже раза в неделю. Законопроект проходит Палату, Администрацию Президента и Губернатора (молчание 7 дней равно подписи). Поправки в Конституцию: 2/3 Палаты и утверждение, первую статью менять нельзя. Предложения граждан рассматриваются до 7 дней.",""],
["Статьи","III","Судебная власть","Верховный, Апелляционный и Окружной суды; решения Верховного судьи не оспариваются. Судей назначает Верховный судья, его назначает Губернатор. Снять судью можно голосами 2/3 Палаты. Право на адвоката. Губернатор может помиловать (кроме госизмены и дважды осуждённых за тяжкие). Верховный суд толкует Конституцию и создаёт прецеденты.",""],
["Статьи","IV","Исполнительная власть","Губернатор избирается прямыми выборами (от 32 лет, гражданин, 5 лет в штате). Преемственность: вице-губернатор, Генпрокурор, председатель Конгресса, министр нацбезопасности. Исполнительная ветвь: FIB, NG, LSPD, SAHP, USSS, EMS, Прокуратура. Генпрокурор надзирает за госструктурами и обвиняет в суде. Губернатор издаёт указы, распоряжается казной, формирует министерства.",""],
["Статьи","V","Права и свободы","Обязанности: соблюдать законы, платить налоги и штрафы, не вредить имуществу. Гражданин: прожил в штате от 5 лет. Свобода слова и мирных собраний (митинг согласуют с Губернатором, иначе он несанкционированный). Тайна переписки и частной жизни: ограничение только по ордеру Генпрокурора или Верховного судьи. Иск или обращение в течение 48 часов. Презумпция невиновности, право не свидетельствовать против себя, залог по закону. Законы действуют с публикации на портале; незнание закона не освобождает.",""],
["Статьи","VI","Структура штата","Четыре категории госслужащих (Губернатор; руководители структур и Верховный судья; заместители и руководители подразделений; остальные). Столица Los Santos, два округа: Los Santos (LSPD) и Blaine (SAHP). За пределы округа можно выходить по служебной необходимости (CODE-0, особое положение, процессуальные действия, преследование, ОРМ и др.). FIB, USSS, NG и EMS действуют по всему штату.",""],
["Статьи","VII","Иерархия актов","Конституция, кодексы, законы, постановления Верховного суда, указы и постановления Правительства, уставы организаций. Приказы внутри структур не могут противоречить законам, иначе не исполняются.",""],
["Статьи","VIII","Первые лица штата","Люди на высших постах в Капитолии: Губернатор, ВРИО Губернатора, Вице-Губернатор, Генеральный прокурор и далее (в выгрузке текст обрезан).",""]
]};
const OTHERC=Object.keys(OTH).map(c=>"== "+NAME[c]+" ==\n"+OTH[c].map(a=>`${a[1]} ${a[2]}: ${a[3]}${a[4]?" | наказание: "+a[4]:""}`).join("\n")).join("\n");
let cd="uk",og="";
const EMPTY=`<p class="empty">Ничего не найдено. Проверьте номер статьи, снимите фильтры или попробуйте другое слово.</p>`;
function tabs(){
  $("#tabs").innerHTML=Object.keys(NAME).map(c=>`<button class="chip" data-c="${c}" aria-pressed="${c===cd}">${NAME[c]}</button>`).join("");
  $("#filters").style.display=cd==="uk"?"":"none";
  $("#src").href=THR[cd]?"https://forum.grand-rp.su/threads/"+THR[cd]+"/":"https://forum.grand-rp.su/forums/960/";
}
function oCard(c,a){return `<article><h2><span class="num">${hl(a[1])}</span>${hl(a[2])}</h2><p>${hl(a[3])}</p>${a[4]?`<div class="meta" style="margin-top:6px"><span class="pen">${hl(a[4])}</span></div>`:""}${q?`<p class="meta" style="margin-top:6px">${esc(NAME[c])}</p>`:""}</article>`}
const renderUK=render;
render=function(){
  tabs();
  if(cd==="uk"||q){
    renderUK();
    if(q){let o="",n=0;const nq=q.toLowerCase();for(const c in OTH)OTH[c].forEach(a=>{if(a.join(" ").toLowerCase().includes(nq)){o+=oCard(c,a);n++}});if(n)$("#list").insertAdjacentHTML("beforeend",`<p class="head">Другие кодексы: ${n}</p>`+o)}
    return;
  }
  const items=OTH[cd],gs=[...new Set(items.map(a=>a[0]))];
  if(!gs.includes(og))og=gs[0];
  $("#nav").innerHTML=gs.map(g=>`<button data-g="${esc(g)}" aria-current="${g===og}">${esc(g)}<small>${items.filter(a=>a[0]===g).length}</small></button>`).join("");
  const o=items.filter(a=>a[0]===og).map(a=>oCard(cd,a)).join("");
  $("#list").innerHTML=`<p class="head">${esc(NAME[cd]+" · "+og)}</p>`+o;
};
$("#tabs").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;cd=b.dataset.c;q="";$("#q").value="";render()});
$("#nav").addEventListener("click",e=>{
  const g=e.target.closest("button[data-g]");
  if(g){e.stopPropagation();og=g.dataset.g;render();return}
  if(e.target.closest("button[data-id]"))cd="uk";
},true);

const DEF={acc:"#0f7b8a",r:4,d:1,hf:"Unbounded",th:"auto"};
let sk={...DEF};
function skin(){
  const s=document.documentElement;s.dataset.skin="1";
  s.style.setProperty("--acc",sk.acc);
  s.style.setProperty("--r",sk.r+"px");
  s.style.setProperty("--d",sk.d);
  s.style.setProperty("--hf",'"'+sk.hf+'"');
  if(sk.th==="auto")s.removeAttribute("data-theme");else s.dataset.theme=sk.th;
  try{localStorage.setItem("skin",JSON.stringify(sk))}catch(_){}
}
function mark(){
  const d=$("#dz");
  d.querySelectorAll("[data-a]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.a===sk.acc)));
  d.querySelectorAll("[data-f]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.f===sk.hf)));
  d.querySelectorAll("[data-t2]").forEach(x=>x.setAttribute("aria-pressed",String(x.dataset.t2===sk.th)));
  $("#r").value=sk.r;$("#rv").textContent=sk.r;$("#dn").value=sk.d;
  const cc=$("#cc");if(cc)cc.value=sk.acc;
}

  const b=e.target.closest("button");if(!b)return;
  if(b.id==="dt"){const p=$("#dp");p.hidden=!p.hidden;b.setAttribute("aria-expanded",String(!p.hidden));return}
  if(b.id==="cp"){try{navigator.clipboard.writeText(JSON.stringify(sk)).then(()=>{b.textContent="Скопировано!"},()=>{b.textContent="Не удалось"})}catch(_){}setTimeout(()=>b.textContent="Скопировать настройки",1500);return}
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  if(b.dataset.p==="rnd")sk={acc:`hsl(${Math.floor(Math.random()*360)} 65% 38%)`,r:Math.floor(Math.random()*27),d:+(0.85+Math.random()*0.5).toFixed(2),hf:pick(["Unbounded","Golos Text"]),th:pick(["auto","light","dark"])};
  else if(b.dataset.p!==undefined){const p=PR[+b.dataset.p];sk={acc:p[1],r:p[2],d:p[3],hf:p[4],th:p[5]}}

  else if(b.id==="rs")sk={...DEF};

// ===== ИИ-помощник (через Cloudflare Worker + DeepSeek) =====
const AI_URL = "https://shizoid-ai.daniil-starikov-222.workers.dev";
let hist = [];
const EX = ["Что грозит за ограбление?","Какой штраф за превышение скорости?","Когда задержанного обязаны освободить?","Можно ли выйти под залог за убийство?","Чем федеральное преступление отличается от регионального?","Что дают признание вины и помощь следствию?"];
$("#ex").innerHTML = EX.map(x => `<button class="chip" data-q="${esc(x)}">${esc(x)}</button>`).join("");
$("#aibox").hidden = false;
$("#aistate").hidden = true;

async function ask(question) {
  if (!question.trim()) return;
  const out = $("#ans"), btn = $("#go");
  btn.disabled = true;
  out.textContent = "Думаю…";

  // Формируем историю для контекста
  const history = hist.slice(-3).flatMap(([q, a]) => [
    { role: "user", content: q },
    { role: "assistant", content: a }
  ]);

  try {
    const r = await fetch(AI_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, history })
    });
    const data = await r.json();
    if (data.error) {
      out.textContent = "Ошибка: " + data.error;
    } else {
      out.textContent = data.text || "Пустой ответ";
      hist.push([question, (data.text || "").slice(0, 600)]);
    }
  } catch (e) {
    out.textContent = "Не удалось связаться с помощником. Проверь интернет или Worker.";
  }
  btn.disabled = false;
}
$("#go").addEventListener("click", () => ask($("#aq").value));
$("#aq").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    ask($("#aq").value);
  }
});
$("#ex").addEventListener("click", e => {
  const b = e.target.closest("[data-q]");
  if (!b) return;
  $("#aq").value = b.dataset.q;
  ask(b.dataset.q);
});
</script>
